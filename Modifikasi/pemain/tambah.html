<!DOCTYPE html>
<html lang="id"> 
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>GameHub| Tambah Pemain</title>
        <link rel="stylesheet" href="../assets/CSS/style.css">
    </head>
    <body>
        <header>
            <h1>GameHub</h1>
            <nav>
                <ul>
                    <li><a href="../index.html">Beranda</a></li>
                    <li><a href="../game/list.html">Daftar Game</a></li>
                    <li><a href="../game/tambah.html">Tambah Game</a></li>
                    <li><a href="list.html">Daftar Pemain</a></li>
                    <li><a href="tambah.html">Tambah Pemain</a></li>
                </ul>
            </nav>
        </header>

        <main>
            <section>
                <h2>Tambah Pemain Baru</h2>
                <form id="form-tambah-pemain">
                    <p>
                        <label for="id_player">ID Player / Akun</label><br>
                        <input type="text" id="id_player" name="id_player" required>
                    </p>
                    <p>
                        <label for="username">Username / Nama Panggilan</label><br>
                        <input type="text" id="username" name="username" required>
                    </p>
                    <p>
                        <label for="no_hp">No. HP</label><br>
                        <input type="text" id="no_hp" name="no_hp" placeholder="Contoh: 08xxxx">
                    </p>
                    <p>
                        <label for="email">Email Terdaftar</label><br>
                        <input type="email" id="email" name="email">
                    </p>
                    <p>
                        <button type="submit">Simpan Pemain</button>
                    </p>
                </form>
            </section>
        </main>

        <footer>
            <p>&copy; 2026 GameHub &mdash; Manajemen Game</p>
        </footer>
        <script src="../assets/js/app.js"></script>
    </body>
</html>
