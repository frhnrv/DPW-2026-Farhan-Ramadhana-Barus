<!DOCTYPE html>
<html lang="id">
    <head>
        <meta charset="UTF-8">
        <title>SIGAME | Tambah Game</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="../assets/CSS/style.css">
    </head>
    <body>
        <header>
            <h1>SIGAME</h1>
            <button type="button" id="nav-toggle-btn" class="nav-toggle-label" aria-label="Menu">&#9776;</button>
            <nav>
                <ul>
                    <li><a href="../index.html">Beranda</a></li>
                    <li><a href="list.html">Daftar Game</a></li>
                    <li><a href="tambah.html">Tambah Game</a></li>
                    <li><a href="../pemain/list.html">Daftar Pemain</a></li>
                    <li><a href="../pemain/tambah.html">Tambah Pemain</a></li>
                </ul>
            </nav>
        </header>

        <main>
            <section>
                <h2>Tambah Game Baru</h2>
                <form id="form-tambah-game">
                    <p>
                        <label for="judul">Judul Game</label><br>
                        <input type="text" id="judul" name="judul" required>
                    </p>
                    <p>
                        <label for="developer">Developer / Studio</label><br>
                        <input type="text" id="developer" name="developer" required>
                    </p>
                    <p>
                        <label for="tahun">Tahun Rilis</label><br>
                        <input type="number" id="tahun" name="tahun" min="1980" max="2026" required>
                    </p>
                    <p>
                        <label for="kode_serial">Kode Lisensi / Serial</label><br>
                        <input type="text" id="kode_serial" name="kode_serial">
                    </p>
                    <p>
                        <label for="genre">Genre Game</label><br>
                        <select id="genre" name="genre">
                            <option value="action">Action / Adventure</option>
                            <option value="rpg">RPG / MMORPG</option>
                            <option value="strategy">Strategy</option>
                            <option value="sports">Sports & Racing</option>
                        </select>
                    </p>
                    <p>
                        <button type="submit">Simpan Game</button>
                    </p>
                </form>
            </section>
        </main>

        <footer>
            <p>&copy; 2026 SIGAME &mdash; Manajemen Game</p>
        </footer>
        <script src="../assets/js/app.js"></script>
    </body>
</html>
